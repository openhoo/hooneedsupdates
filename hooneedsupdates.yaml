# yaml-language-server: $schema=schemas/config.schema.json
version: 1
managers:
  - gomod
  - cargo
  - npm
  - nuget
  - github-actions
  - docker
excludePaths:
  - '(^|/)(fixtures|testdata|\.oracle)(/|$)'
allowedUpdateTypes:
  - patch
  - minor
  - major
concurrency: 8
requestTimeout: 15s
lockfileTimeout: 5m
includePrereleases: false
packageRules:
  - dependency: '^openhoo/hooneedsupdates$'
    managers: [github-actions, custom]
    group: hooneedsupdates
    sharedVersion: true
    channel: stable
  - dependency: '^openhoo/hooversion$'
    managers: [github-actions, custom]
    group: hooversion
    sharedVersion: true
    channel: stable
  - dependency: '^openhoo/hoolicy$'
    managers: [github-actions, custom]
    group: hoolicy
    sharedVersion: true
    channel: stable
  - dependency: '^openhoo/hooray$'
    managers: [github-actions, custom]
    group: hooray
    sharedVersion: true
    channel: stable
  - dependency: '^openhoo/hoonarqube$'
    managers: [github-actions, custom]
    group: hoonarqube
    sharedVersion: true
    channel: stable
  - dependency: '^openhoo/hoocloak$'
    managers: [github-actions, custom]
    group: hoocloak
    sharedVersion: true
    channel: stable
  - dependency: '^openhoo/hoomail$'
    managers: [github-actions, custom]
    group: hoomail
    sharedVersion: true
    channel: stable
  - dependency: '^openhoo/hoosharper$'
    managers: [github-actions, custom]
    group: hoosharper
    sharedVersion: true
    channel: stable
automation:
  repositories:
    - openhoo/hooneedsupdates
    - openhoo/hooversion
    - openhoo/hoolicy
    - openhoo/hooray
    - openhoo/hoonarqube
    - openhoo/hoocloak
    - openhoo/hoomail
    - openhoo/hoosharper
  branchPrefix: hooneedsupdates
  labels: []
  lockfiles: true
  draft: false
  selection:
    managers: [github-actions, custom]
    dependencies:
      - '^openhoo/(hooneedsupdates|hooversion|hoolicy|hooray|hoonarqube|hoocloak|hoomail|hoosharper)$'
  autoMerge:
    enabled: true
    updateTypes: [patch, minor]
    managers: [github-actions, custom]
    dependencies:
      - '^openhoo/(hooneedsupdates|hooversion|hoolicy|hooray|hoonarqube|hoocloak|hoomail|hoosharper)$'
    maxUpdates: 50
    requireLockfiles: true
  rateLimit:
    stateFile: .hooneedsupdates/rate-limit.json
    maxRetries: 2
    maxWait: 30s
  mergeMethod: squash
  closeStale: true
  commitAuthor: HooNeedsUpdates Bot
  commitEmail: hooneedsupdates[bot]@users.noreply.github.com
customManagers:
  - name: hooversion-version
    datasource: github-releases
    dependencyName: openhoo/hooversion
    filePatterns:
      - '^\.github/workflows/.*\.ya?ml$'
    matchStrings:
      - 'HOOVERSION_VERSION:\s*["'']?(?P<currentValue>[^\s"'']+)'
