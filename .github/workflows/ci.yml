name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HOOVERSION_VERSION: 1.1.2

jobs:
  commits:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint Conventional Commits
        uses: openhoo/hooversion/actions/lint@f0a37cca22997993ca6416010b81ca197a3ac580 # v1.1.2
        with:
          version: ${{ env.HOOVERSION_VERSION }}

  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal scripts actions)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test ./... -race -count=1 -coverprofile=coverage.out
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -X main.version=ci' -o bin/hooneedsupdates ./cmd/hooneedsupdates
      - name: Smoke CLI
        run: |
          bin/hooneedsupdates version
          bin/hooneedsupdates scan --format json --fail-on unresolved . > update-report.json
          jq -e '.schemaVersion == 2 and (.planDigest | test("^sha256:[0-9a-f]{64}$")) and .summary.unresolved == 0' update-report.json >/dev/null
        env:
          GITHUB_TOKEN: ${{ github.token }}

  macos:
    name: macOS filesystem regressions
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check root aliases and lockfile transactions
        run: go test ./internal/update -run 'Test(RepositoryRoot|ApplyWithLockfiles|LockfilesIgnoreInherited)' -count=1

  windows:
    name: Windows native tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test native code and transactions
        run: go test ./cmd/... ./internal/... -count=1
      - name: Build and run CLI
        run: |
          go build -o hooneedsupdates.exe ./cmd/hooneedsupdates
          ./hooneedsupdates.exe version
          ./hooneedsupdates.exe apply --help

  minimum-go:
    name: Minimum Go version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Test with minimum supported Go
        run: go test ./cmd/... ./internal/... -count=1
        env:
          GOTOOLCHAIN: local

  package-managers:
    name: Executable package-manager qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
      - name: Install supported npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify Cargo runtime
        run: cargo --version
      - name: Regenerate real lockfiles twice
        run: go test ./internal/update -run 'TestExecutable.*' -v -count=1
        env:
          HOONEEDSUPDATE_INTEGRATION: '1'
          GOTOOLCHAIN: local

  policy:
    name: Hoostack policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@2175cd50a816e90b37a0395d6bb93e6ce729c256 # v0.4.0
        with:
          version: 0.4.0
      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@7f706fe4ae06f9a2408dc9d0abb78048d2366db7 # v0.9.0
        with:
          version: 0.9.0
          policy: hooray-policy.yaml
          format: table
          output: ''
      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@1b08eba7832f32c6ed5233e51d725092c6e8de77 # v0.10.4
        with:
          version: 0.10.4
          paths: |
            cmd
            internal
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none
