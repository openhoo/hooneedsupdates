name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HOOVERSION_VERSION: 1.1.1

jobs:
  commits:
    name: Lint commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint Conventional Commits
        uses: openhoo/hooversion/actions/lint@ac503b23b9b36ebbf39ee6103713c81f1f18b64d # v1.1.1
        with:
          version: ${{ env.HOOVERSION_VERSION }}

  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test ./... -race -count=1 -coverprofile=coverage.out
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -X main.version=ci' -o bin/hooneedsupdates ./cmd/hooneedsupdates
      - name: Smoke CLI
        run: |
          bin/hooneedsupdates version
          bin/hooneedsupdates scan --format json --fail-on unresolved . > update-report.json
          jq -e '.schemaVersion == 2 and (.planDigest | test("^sha256:[0-9a-f]{64}$")) and .summary.unresolved == 0' update-report.json >/dev/null
        env:
          GITHUB_TOKEN: ${{ github.token }}

  policy:
    name: Hoostack policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@46529a99335938e7284f11099bf15f7e1800e6f5 # v0.3.1
        with:
          version: 0.3.1
      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@f2b28d71398749142f4d9366b0427369f3af6e02 # v0.6.5
        with:
          version: 0.6.5
          policy: hooray-policy.yaml
          format: table
          output: ''
      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@11e4d2d44f5e34d11a7c03e4a87eea857ceea8ed # v0.3.0
        with:
          version: 0.3.0
          paths: |
            cmd
            internal
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none
