name: Update Hoostack

on:
  schedule:
    - cron: '17 */6 * * *'
  repository_dispatch:
    types: [hoostack-tool-released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-hoostack
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile dependency pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check GitHub App configuration
        id: configured
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.HOONEEDSUPDATES_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.HOONEEDSUPDATES_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Configure HOONEEDSUPDATES_APP_CLIENT_ID and HOONEEDSUPDATES_APP_PRIVATE_KEY to activate fleet updates.'
          fi

      - name: Create repository-scoped GitHub App token
        if: steps.configured.outputs.value == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOONEEDSUPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOONEEDSUPDATES_APP_PRIVATE_KEY }}
          owner: openhoo
          repositories: |
            hooneedsupdates
            hooversion
            hoolicy
            hooray
            hoonarqube
            hoocloak
            hoomail
            hoosharper
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout HooNeedsUpdates
        if: steps.configured.outputs.value == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore GitHub rate-limit state
        if: steps.configured.outputs.value == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hooneedsupdates/rate-limit.json
          key: hooneedsupdates-rate-limit-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hooneedsupdates-rate-limit-${{ runner.os }}-

      - name: Set up Go
        if: steps.configured.outputs.value == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true

      - name: Reconcile Hoostack update pull requests
        if: steps.configured.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: go run ./cmd/hooneedsupdates update-repos --write --format json

      - name: Save GitHub rate-limit state
        if: >-
          always() &&
          steps.configured.outputs.value == 'true' &&
          hashFiles('.hooneedsupdates/rate-limit.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hooneedsupdates/rate-limit.json
          key: hooneedsupdates-rate-limit-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
